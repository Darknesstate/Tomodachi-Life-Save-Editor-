name: Build Tomodachi 3DS
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      - name: Build 3DSX + Shiny + Resize
        run: |
          make
          python3 -m pip install -q pillow || true
          python3 <<'PYEOF'
          try:
              from PIL import Image, ImageDraw
              import os
              if os.path.exists("icon.png"):
                  im = Image.open("icon.png").convert("RGBA").resize((48,48), Image.LANCZOS)
                  im.save("icon.png")
                  print("icon 48x48 ok")
              if os.path.exists("banner.png"):
                  im = Image.open("banner.png").convert("RGBA").resize((256,128), Image.LANCZOS)
                  im.save("banner.png")
                  print("banner 256x128 ok")
              for src, dst in [("icon.png", "icon_shiny.png"), ("banner.png", "banner_shiny.png")]:
                  if not os.path.exists(src):
                      continue
                  im = Image.open(src).convert("RGBA")
                  w, h = im.size
                  draw = ImageDraw.Draw(im)
                  for fx, fy, s in [(0.78, 0.18, 0.12), (0.88, 0.38, 0.08)]:
                      cx, cy = int(w*fx), int(h*fy)
                      r = int(min(w,h)*s)
                      draw.line([(cx-r, cy), (cx+r, cy)], fill=(255,255,255,230), width=max(1, r//3))
                      draw.line([(cx, cy-r), (cx, cy+r)], fill=(255,255,255,230), width=max(1, r//3))
                  im.save(dst)
          except Exception as e:
              print(f"sem PIL: {e}")
          PYEOF
          if [ ! -f icon_shiny.png ]; then cp icon.png icon_shiny.png || true; fi
          if [ ! -f banner_shiny.png ]; then cp banner.png banner_shiny.png || true; fi
          ICON_FILE="icon.png"
          if [ -f icon_shiny.png ]; then ICON_FILE="icon_shiny.png"; fi
          smdhtool --create "Tomodachi Life Save Editor" "Dinheiro Max no Tomodachi Life" "Darkness Metal" $ICON_FILE TomodachiLifeSaveEditor.smdh
          ls -lh TomodachiLifeSaveEditor.elf TomodachiLifeSaveEditor.3dsx TomodachiLifeSaveEditor.smdh || true

      - name: Get tools
        run: |
          mkdir -p /tmp/tools /tmp/bt /tmp/mk || true
          echo "Baixando makerom ZIP oficial 3DSGuy"
          curl -L --fail -o /tmp/makerom.zip https://github.com/3DSGuy/Project_CTR/releases/latest/download/makerom-linux-x86_64.zip || curl -L --fail -o /tmp/makerom.zip https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18/makerom-v0.18-ubuntu_x86_64.zip || echo "makerom zip falhou"
          unzip -o /tmp/makerom.zip -d /tmp/mk || true
          find /tmp/mk -type f -iname "*makerom*" -exec cp {} /tmp/tools/makerom \; || true
          chmod +x /tmp/tools/makerom || true
          file /tmp/tools/makerom || true
          ls -lh /tmp/tools/makerom || echo "SEM MAKEROM"
          echo "Baixando bannertool"
          curl -L --fail -o /tmp/bannertool.zip https://github.com/Epicpkmn11/bannertool/releases/download/v1.2.0/bannertool.zip || curl -L --fail -o /tmp/bannertool.zip https://github.com/Steveice10/bannertool/releases/download/v1.2.0/bannertool.zip || echo "bannertool zip falhou"
          unzip -o /tmp/bannertool.zip -d /tmp/bt || true
          find /tmp/bt -type f | head -n 20 || true
          find /tmp/bt -type f -iname "*bannertool*" -exec file {} \; || true
          find /tmp/bt -type f -path "*linux*" -iname "*bannertool*" -exec cp {} /tmp/tools/bannertool \; || true
          if [ ! -f /tmp/tools/bannertool ]; then find /tmp/bt -type f -iname "*bannertool*" -exec cp {} /tmp/tools/bannertool \; || true; fi
          chmod +x /tmp/tools/bannertool || true
          file /tmp/tools/bannertool || true
          ls -lh /tmp/tools/ || true

      - name: Make som Umbreon Black 2
        run: |
          python3 <<'PYEOF'
          import os, wave, math, struct
          def make_shiny():
              print("gerando som shiny")
              w = wave.open('banner_sound.wav','wb')
              w.setnchannels(2)
              w.setsampwidth(2)
              w.setframerate(44100)
              frames = b''
              for i in range(66150):
                  t = i/44100
                  f = 600 + 1200*t
                  v = int(12000 * math.sin(2*math.pi*f*t) * (1-t/1.6))
                  if int(t*10)%3==0:
                      v += int(4000 * math.sin(2*math.pi*2800*t))
                  v = max(-32767, min(32767, v))
                  frames += struct.pack('<hh', v, v)
              w.writeframes(frames)
              w.close()
          if os.path.exists("umbreon_cry.wav"):
              try:
                  w = wave.open("umbreon_cry.wav","rb")
                  ch, sw, fr, n = w.getnchannels(), w.getsampwidth(), w.getframerate(), w.getnframes()
                  data = w.readframes(min(n, int(fr*1.5)))
                  w.close()
                  out = wave.open("banner_sound.wav","wb")
                  out.setnchannels(2)
                  out.setsampwidth(2)
                  out.setframerate(44100)
                  if ch==1 and sw==2:
                      import array
                      a = array.array('h')
                      a.frombytes(data)
                      stereo = b''.join([struct.pack('<hh', v, v) for v in a])
                      out.writeframes(stereo)
                  else:
                      out.writeframes(data)
                  out.close()
                  print("usando seu umbreon_cry.wav cortado pra 1.5s")
              except Exception as e:
                  print(f"falha no seu wav: {e}, usando shiny")
                  make_shiny()
          else:
              make_shiny()
          PYEOF
          ls -lh banner_sound.wav || true

      - name: Make banner + icon
        run: |
          export PATH="/tmp/tools:$PATH"
          BANNER_IMG="banner.png"
          if [ -f banner_shiny.png ]; then BANNER_IMG="banner_shiny.png"; fi
          ICON_IMG="icon.png"
          if [ -f icon_shiny.png ]; then ICON_IMG="icon_shiny.png"; fi
          ls -lh $BANNER_IMG $ICON_IMG banner_sound.wav || true
          if [ -x /tmp/tools/bannertool ]; then
            bannertool makebanner -i $BANNER_IMG -a banner_sound.wav -o banner.bnr || echo "bannertool falhou"
            bannertool makesmdh -s "Tomodachi Life Save Editor" -l "Dinheiro Max no Tomodachi Life" -p "Darkness Metal" -i $ICON_IMG -o TomodachiLifeSaveEditor.icn || echo "makesmdh falhou, usando smdh"
            ls -lh banner.bnr TomodachiLifeSaveEditor.icn || true
          else
            echo "ERRO: sem bannertool"
            exit 1
          fi
          if [ ! -f TomodachiLifeSaveEditor.icn ]; then cp TomodachiLifeSaveEditor.smdh TomodachiLifeSaveEditor.icn || true; fi

      - name: Make CIA com RSF minimo + desc app4
        run: |
          export PATH="/tmp/tools:$PATH"
          if [ ! -x /tmp/tools/makerom ]; then echo "ERRO: sem makerom"; exit 1; fi
          if [ ! -f banner.bnr ]; then echo "ERRO: sem banner.bnr"; exit 1; fi
          python3 <<'PYEOF'
          rsf = """BasicInfo:
            Title                   : "Tomodachi Life Save Editor"
            ProductCode             : "CTR-P-TLSE"
            Logo                    : Nintendo
          TitleInfo:
            Category                : Application
            UniqueId                : 0x01F001
          Option:
            UseOnSD                 : true
            FreeProductCode         : true
            MediaFootPadding        : false
            EnableCrypt             : false
            EnableCompress          : true
          AccessControlInfo:
            CoreVersion                   : 2
            DescVersion                   : 2
            ReleaseKernelMajor            : "02"
            ReleaseKernelMinor            : "33"
            UseExtSaveData                : false
            FileSystemAccess:
              - CategoryFileSystemTool
              - DirectSdmc
              - DirectSdmcWrite
              - Debug
            MemoryType                    : Application
            SystemMode                    : 64MB
            IdealProcessor                : 0
            AffinityMask                  : 1
            Priority                      : 16
            MaxCpu                        : 0x9E
            HandleTableSize               : 0x200
            DisableDebug                  : false
            EnableForceDebug              : false
            CanWriteSharedPage            : true
            CanUsePrivilegedPriority      : false
            CanUseNonAlphabetAndNumber    : true
            PermitMainFunctionArgument    : true
            CanShareDeviceMemory          : true
            RunnableOnSleep               : false
            SpecialMemoryArrange          : true
            SystemModeExt                 : Legacy
            CpuSpeed                      : 256MHz
            EnableL2Cache                 : true
            CanAccessCore2                : true
            IORegisterMapping:
              - 1ff00000-1ff7ffff
            MemoryMapping:
              - 1f000000-1f5fffff:r
            SystemCallAccess:
              ArbitrateAddress: 34
              Backdoor: 123
              Break: 60
              CancelTimer: 28
              ClearEvent: 25
              ClearTimer: 29
              CloseHandle: 35
              ConnectToPort: 45
              ControlMemory: 1
              ControlProcessMemory: 112
              CreateAddressArbiter: 33
              CreateEvent: 23
              CreateMemoryBlock: 30
              CreateMutex: 19
              CreateSemaphore: 21
              CreateThread: 8
              CreateTimer: 26
              DuplicateHandle: 39
              ExitProcess: 3
              ExitThread: 9
              GetCurrentProcessorNumber: 17
              GetHandleInfo: 41
              GetProcessId: 53
              GetProcessIdOfThread: 54
              GetProcessIdealProcessor: 6
              GetProcessInfo: 43
              GetResourceLimit: 56
              GetResourceLimitCurrentValues: 58
              GetResourceLimitLimitValues: 57
              GetSystemInfo: 42
              GetSystemTick: 40
              GetThreadContext: 59
              GetThreadId: 55
              GetThreadIdealProcessor: 15
              GetThreadInfo: 44
              GetThreadPriority: 11
              MapMemoryBlock: 31
              OutputDebugString: 61
              QueryMemory: 2
              ReleaseMutex: 20
              ReleaseSemaphore: 22
              SendSyncRequest1: 46
              SendSyncRequest2: 47
              SendSyncRequest3: 48
              SendSyncRequest4: 49
              SendSyncRequest: 50
              SetThreadPriority: 12
              SetTimer: 27
              SignalEvent: 24
              SleepThread: 10
              UnmapMemoryBlock: 32
              WaitSynchronization1: 36
              WaitSynchronizationN: 37
            ServiceAccessControl:
              - APT:U
              - ac:u
              - am:net
              - boss:U
              - cam:u
              - cecd:u
              - cfg:nor
              - cfg:u
              - csnd:SND
              - dsp::DSP
              - frd:u
              - fs:USER
              - gsp::Gpu
              - hid:USER
              - http:C
              - ir:rst
              - ir:u
              - ir:USER
              - mic:u
              - ndm:u
              - news:u
              - nwm::UDS
              - ptm:u
              - pxi:dev
              - soc:U
              - ssl:C
              - y2r:u
          SystemControlInfo:
            SaveDataSize: 0KB
            RemasterVersion: 2
            StackSize: 0x40000
            Dependency:
              ac: 0x0004013000002402
              am: 0x0004013000001502
              boss: 0x0004013000003402
              camera: 0x0004013000001602
              cecd: 0x0004013000002602
              cfg: 0x0004013000001702
              codec: 0x0004013000001802
              csnd: 0x0004013000002702
              dlp: 0x0004013000002802
              dsp: 0x0004013000001a02
              friends: 0x0004013000003202
              gpio: 0x0004013000001b02
              gsp: 0x0004013000001c02
              hid: 0x0004013000001d02
              http: 0x0004013000002902
              i2c: 0x0004013000001e02
              ir: 0x0004013000003302
              mcu: 0x0004013000001f02
              mic: 0x0004013000002002
              ndm: 0x0004013000002b02
              news: 0x0004013000003502
              nim: 0x0004013000002c02
              nwm: 0x0004013000002d02
              pdn: 0x0004013000002102
              ps: 0x0004013000003102
              ptm: 0x0004013000002202
              ro: 0x0004013000003702
              socket: 0x0004013000002e02
              spi: 0x0004013000002302
              ssl: 0x0004013000002f02
          """
          open("game.rsf","w").write(rsf)
          print("game.rsf escrito")
          PYEOF
          cat game.rsf
          echo "Fazendo CIA com RSF + desc app:4 juntos"
          makerom -f cia -o TomodachiLifeSaveEditor.cia -rsf game.rsf -target t -desc app:4 -exefslogo -elf TomodachiLifeSaveEditor.elf -icon TomodachiLifeSaveEditor.icn -banner banner.bnr
          ls -lh TomodachiLifeSaveEditor.cia

      - name: Upload tudo
        uses: actions/upload-artifact@v4
        with:
          name: TomodachiLifeSaveEditor
          path: |
            TomodachiLifeSaveEditor.3dsx
            TomodachiLifeSaveEditor.smdh
            TomodachiLifeSaveEditor.cia
          if-no-files-found: error

      - name: Upload 3DSX mesmo se CIA falhar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TomodachiLifeSaveEditor-3DSX-fallback
          path: |
            TomodachiLifeSaveEditor.3dsx
            TomodachiLifeSaveEditor.smdh
          if-no-files-found: warn

name: Build Tomodachi 3DS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Compilar .3dsx e .cia
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM
          export PATH=$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH
          arm-none-eabi-gcc -g -Wall -O2 -march=armv6k -mtune=mpcore -mfloat-abi=hard -mtp=soft -DARM11 -D_3DS -I$DEVKITPRO/libctru/include source/main.c -o TomodachiReal.elf -specs=3dsx.specs -L$DEVKITPRO/libctru/lib -lctru -lm
          3dsxtool TomodachiReal.elf TomodachiReal.3dsx
          python3 -c "import zlib,struct; w=h=48; raw=b''.join([b'\x00'+b'\xff\x33\x33\xff'*w for _ in range(h)]); 
          def chunk(t,d): c=t+d; return struct.pack('>I',len(d))+c+struct.pack('>I',zlib.crc32(c)&0xffffffff)
          open('icon48.png','wb').write(b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',w,h,8,6,0,0,0))+chunk(b'IDAT',zlib.compress(raw))+chunk(b'IEND',b''))"
          smdhtool --create "TomodachiReal" "Editor de Save Tomodachi" "Darknesstate" icon48.png TomodachiReal.smdh
          cat > TomodachiReal.rsf << 'RSFEOF'
          BasicInfo:
            Title                   : "TomodachiReal"
            CompanyCode             : "00"
            ProductCode             : "CTR-P-TMDR"
            ContentType             : Application
            Logo                    : Nintendo
          TitleInfo:
            UniqueId                : 0x00000000
            Category                : Application
          Option:
            UseOnSD                 : true
            EnableCompress          : true
            FreeProductCode         : true
            EnableCrypt             : false
            MediaFootPadding        : false
          AccessControlInfo:
            CoreVersion             : 2
            DescVersion             : 2
            ReleaseKernelMajor      : "02"
            ReleaseKernelMinor      : "33"
            UseExtSaveData          : false
            FileSystemAccess:
              - DirectSdmc
            MemoryType              : Application
            SystemMode              : 64MB
            IdealProcessor          : 0
            AffinityMask            : 1
            Priority                : 16
            MaxCpu                  : 0
            HandleTableSize         : 0x200
            DisableDebug            : false
            EnableForceDebug        : false
            CanWriteSharedPage      : true
            CanUsePrivilegedPriority : false
            CanUseNonAlphabetAndNumber : true
            PermitMainFunctionArgument : true
            CanShareDeviceMemory    : true
            RunnableOnSleep         : false
            SpecialMemoryArrange    : true
            SystemModeExt           : 124MB
            CpuSpeed                : 804MHz
            EnableL2Cache           : true
            CanAccessCore2          : true
            IORegisterMapping:
              - 1ff00000-1ff7ffff
            MemoryMapping:
              - 1f000000-1f5fffff:r
            ServiceAccessControl:
              - cfg:u
              - fs:USER
              - gsp::Gpu
              - hid:USER
              - APT:U
              - ac:u
              - am:net
              - boss:U
              - cam:u
              - cecd:u
              - frd:u
              - http:C
              - ldr:ro
              - mic:u
              - ndm:u
              - ptm:u
              - soc:U
              - ssl:C
              - y2r:u
          SystemControlInfo:
            SaveDataSize            : 0K
            RemasterVersion         : 0
            StackSize               : 0x40000
          RSFEOF
          elf2exheader TomodachiReal.elf TomodachiReal.exheader || arm-none-eabi-objcopy -O binary --only-section=.exheader TomodachiReal.elf TomodachiReal.exheader || python3 -c "open('TomodachiReal.exheader','wb').write(b'\x00'*0x1000)"
          python3 -c "d=open('TomodachiReal.exheader','rb').read(); open('TomodachiReal.exheader','wb').write(d.ljust(0x1000,b'\x00')[:0x1000])"
          git clone --depth 1 https://github.com/3DSGuy/Project_CTR.git /tmp/ctr
          cd /tmp/ctr/makerom && make -j4 || make
          cd $GITHUB_WORKSPACE
          /tmp/ctr/makerom/bin/makerom -f cia -o TomodachiReal.cia -rsf TomodachiReal.rsf -target t -exefslogo -code TomodachiReal.elf -icon TomodachiReal.smdh -exheader TomodachiReal.exheader -desc app:0
          ls -lh *.3dsx *.cia *.smdh || true

      - name: Salvar arquivos
        uses: actions/upload-artifact@v4
        with:
          name: TomodachiReal-cia
          path: |
            *.3dsx
            *.cia
            *.smdh
            *.elf
            *.exheader

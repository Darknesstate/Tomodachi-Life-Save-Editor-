name: Build 3DS

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build V4
        run: make

      - name: Baixar bannertool e makerom
        run: |
          set -e
          mkdir -p tools
          echo "Baixando bannertool..."
          wget --timeout=20 --tries=2 -O tools/bannertool https://raw.githubusercontent.[STRIPPED 89 bytes] || wget --timeout=20 --tries=2 -O tools/bannertool https://raw.githubusercontent.com/libretro/RetroArch/master/ctr/tools/bannertool-linux || true
          echo "Baixando makerom..."
          wget --timeout=20 --tries=2 -O tools/makerom https://raw.githubusercontent.[STRIPPED 86 bytes] || wget --timeout=20 --tries=2 -O tools/makerom https://raw.githubusercontent.com/libretro/RetroArch/master/ctr/tools/makerom-linux || true
          chmod +x tools/bannertool tools/makerom || true
          ls -lh tools/
          if [ ! -s tools/bannertool ]; then echo "ERRO bannertool vazio"; exit 1; fi
          if [ ! -s tools/makerom ]; then echo "ERRO makerom vazio"; exit 1; fi
          echo "Ferramentas OK"

      - name: Fazer CIA
        run: |
          set -e
          ELF_FILE=$(ls *.elf | head -n 1)
          echo "ELF: $ELF_FILE"
          python3 << 'PY'
          import struct, zlib
          def read_size(p):
            try:
              d=open(p,'rb').read()
              w,h=struct.unpack('>II', d[16:24])
              return w,h
            except:
              return None
          def make_png(w,h,r,g,b,p):
            def ch(t,d):
              c=struct.pack('>I',len(d))+t+d
              return c+struct.pack('>I', zlib.crc32(t+d) & 0xffffffff)
            sig=b'\x89PNG\r\n\x1a\n'
            ihdr=struct.pack('>IIBBBBB',w,h,8,2,0,0,0)
            raw=b''.join(b'\x00'+bytes([r,g,b])*w for _ in range(h))
            open(p,'wb').write(sig+ch(b'IHDR',ihdr)+ch(b'IDAT',zlib.compress(raw))+ch(b'IEND',b''))
          def fix(p, want_w, want_h):
            s=read_size(p)
            print(p, s)
            if s is None:
              print("criando", p)
              make_png(want_w, want_h, 30,0,60, p)
              return
            if s[0]==want_w and s[1]==want_h:
              print("tamanho OK", p)
              return
            print("tamanho errado, criando novo", p)
            make_png(want_w, want_h, 30,0,60, p)
          fix('banner.png',256,128)
          fix('icon.png',48,48)
          PY
          if [ ! -f sound.wav ]; then python3 -c "import wave; w=wave.open('sound.wav','wb'); w.setnchannels(1); w.setsampwidth(2); w.setframerate(22050); w.writeframes(b'\x00\x00'*22050); w.close()"; fi
          ./tools/bannertool makebanner -i banner.png -a sound.wav -o banner.bnr
          ./tools/bannertool makeicon -i icon.png -o icon.icn
          ./tools/makerom -f cia -o "Tomodachi Life Save Editor.cia" -elf "$ELF_FILE" -rsf TomodachiReal.rsf -icon icon.icn -banner banner.bnr -exefslogo -target t
          ls -lh *.cia *.3dsx

      - name: Subir ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Tomodachi-V4-CIA
          path: |
            *.3dsx
            *.cia

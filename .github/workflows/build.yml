name: Build Tomodachi 3DS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Compilar .3dsx e .cia
        shell: bash
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM
          export PATH=$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH
          arm-none-eabi-gcc -g -Wall -O2 -march=armv6k -mtune=mpcore -mfloat-abi=hard -mtp=soft -DARM11 -D_3DS -I$DEVKITPRO/libctru/include source/main.c -o TomodachiReal.elf -specs=3dsx.specs -L$DEVKITPRO/libctru/lib -lctru -lm
          ls -lh TomodachiReal.elf || true
          test -s TomodachiReal.elf
          3dsxtool TomodachiReal.elf TomodachiReal.3dsx
          ls -lh TomodachiReal.3dsx || true
          test -s TomodachiReal.3dsx
          python3 -c "import zlib,struct; w=h=48; raw=b''.join([b'\x00'+b'\xff\x33\x33\xff'*w for _ in range(h)]); 
          def chunk(t,d): c=t+d; return struct.pack('>I',len(d))+c+struct.pack('>I',zlib.crc32(c)&0xffffffff)
          open('icon48.png','wb').write(b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',w,h,8,6,0,0,0))+chunk(b'IDAT',zlib.compress(raw))+chunk(b'IEND',b''))"
          smdhtool --create "TomodachiReal" "Editor de Save Tomodachi" "Darknesstate" icon48.png TomodachiReal.smdh
          cat > TomodachiReal.rsf << 'RSFEOF'
          BasicInfo:
            Title                   : "TomodachiReal"
            CompanyCode             : "00"
            ProductCode             : "CTR-P-TMDR"
            ContentType             : Application
            Logo                    : Nintendo
          TitleInfo:
            UniqueId                : 0x00000000
            Category                : Application
          Option:
            UseOnSD                 : true
            EnableCompress          : true
            FreeProductCode         : true
            EnableCrypt             : false
            MediaFootPadding        : false
          AccessControlInfo:
            CoreVersion             : 2
            DescVersion             : 2
            ReleaseKernelMajor      : "02"
            ReleaseKernelMinor      : "33"
            UseExtSaveData          : false
            FileSystemAccess:
              - DirectSdmc
            MemoryType              : Application
            SystemMode              : 64MB
            IdealProcessor          : 0
            AffinityMask            : 1
            Priority                : 16
            MaxCpu                  : 0
            HandleTableSize         : 0x200
            DisableDebug            : false
            EnableForceDebug        : false
            CanWriteSharedPage      : true
            CanUsePrivilegedPriority : false
            CanUseNonAlphabetAndNumber : true
            PermitMainFunctionArgument : true
            CanShareDeviceMemory    : true
            RunnableOnSleep         : false
            SpecialMemoryArrange    : true
            SystemModeExt           : 124MB
            CpuSpeed                : 804MHz
            EnableL2Cache           : true
            CanAccessCore2          : true
            IORegisterMapping:
              - 1ff00000-1ff7ffff
            MemoryMapping:
              - 1f000000-1f5fffff:r
            SystemCallAccess:
              ArbitrateAddress: 34
              Break: 60
              CancelTimer: 28
              ClearEvent: 25
              ClearTimer: 29
              CloseHandle: 35
              ConnectToPort: 45
              ControlMemory: 1
              CreateAddressArbiter: 33
              CreateEvent: 23
              CreateMemoryBlock: 30
              CreateMutex: 19
              CreateSemaphore: 21
              CreateThread: 8
              CreateTimer: 26
              DuplicateHandle: 39
              ExitProcess: 3
              ExitThread: 9
              GetCurrentProcessorNumber: 17
              GetHandleInfo: 41
              GetProcessId: 53
              GetProcessIdOfThread: 54
              GetProcessIdealProcessor: 6
              GetProcessInfo: 43
              GetResourceLimit: 56
              GetResourceLimitCurrentValues: 58
              GetResourceLimitLimitValues: 57
              GetSystemInfo: 42
              GetSystemTick: 40
              GetThreadContext: 59
              GetThreadId: 55
              GetThreadIdealProcessor: 15
              GetThreadInfo: 44
              GetThreadPriority: 11
              MapMemoryBlock: 31
              OutputDebugString: 61
              QueryMemory: 2
              ReleaseMutex: 20
              ReleaseSemaphore: 22
              SendSyncRequest1: 46
              SendSyncRequest2: 47
              SendSyncRequest3: 48
              SendSyncRequest4: 49
              SendSyncRequest: 50
              SetThreadPriority: 12
              SetTimer: 27
              SignalEvent: 24
              SleepThread: 10
              UnmapMemoryBlock: 32
              WaitSynchronization1: 36
              WaitSynchronizationN: 37
              Backdoor: 123
            ServiceAccessControl:
              - cfg:u
              - fs:USER
              - gsp::Gpu
              - hid:USER
              - ndm:u
              - APT:U
              - ac:u
              - am:net
              - boss:U
              - cam:u
              - cecd:u
              - csnd:SND
              - frd:u
              - http:C
              - ir:USER
              - ldr:ro
              - mic:u
              - ptm:u
              - soc:U
              - ssl:C
              - y2r:u
          SystemControlInfo:
            SaveDataSize            : 0K
            RemasterVersion         : 0
            StackSize               : 0x40000
          RSFEOF
          curl -L -f -o makerom.zip https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18.4/makerom-v0.18.4-ubuntu_x86_64.zip
          ls -lh makerom.zip || true
          file makerom.zip || true
          unzip -l makerom.zip || true
          unzip -o makerom.zip
          ls -lh makerom* || true
          MAKEROM_BIN=$(find . -name "makerom" -type f | head -1)
          echo "MAKEROM_BIN=$MAKEROM_BIN"
          test -n "$MAKEROM_BIN"
          ls -lh "$MAKEROM_BIN" || true
          chmod +x "$MAKEROM_BIN" || true
          dkp-pacman -Sy --noconfirm 3dstools || true
          ls /opt/devkitpro/tools/bin/ | grep -i exheader || true
          which elf2exheader || true
          ls -lh /opt/devkitpro/tools/bin/elf2exheader || true
          elf2exheader --help || true
          arm-none-eabi-objdump -h TomodachiReal.elf || true
          elf2exheader TomodachiReal.elf TomodachiReal.exheader || /opt/devkitpro/tools/bin/elf2exheader TomodachiReal.elf TomodachiReal.exheader || elf2exheader TomodachiReal.elf TomodachiReal.rsf TomodachiReal.exheader || elf2exheader -a TomodachiReal.rsf TomodachiReal.elf TomodachiReal.exheader || arm-none-eabi-objcopy -O binary --only-section=.exheader TomodachiReal.elf TomodachiReal.exheader
          ls -lh TomodachiReal.exheader || true
          test -s TomodachiReal.exheader
          python3 -c "data=open('TomodachiReal.exheader','rb').read(); nz=sum(1 for b in data if b!=0); print('exheader size', len(data), 'bytes nao-zero', nz); import sys; sys.exit(0 if nz>100 else 1)"
          rm -f TomodachiReal.cia
          "$MAKEROM_BIN" -f cia -o TomodachiReal.cia -rsf TomodachiReal.rsf -target t -exefslogo -code TomodachiReal.elf -icon TomodachiReal.smdh -exheader TomodachiReal.exheader -desc app:0 || echo "Tentativa 1 com desc falhou, tentando sem desc"
          test -s TomodachiReal.cia || rm -f TomodachiReal.cia
          test -s TomodachiReal.cia || "$MAKEROM_BIN" -f cia -o TomodachiReal.cia -rsf TomodachiReal.rsf -target t -exefslogo -code TomodachiReal.elf -icon TomodachiReal.smdh -exheader TomodachiReal.exheader
          ls -lh *.3dsx *.cia *.smdh || true
          test -s TomodachiReal.cia
          stat -c%s TomodachiReal.cia

      - name: Salvar arquivos
        uses: actions/upload-artifact@v4
        with:
          name: TomodachiReal-cia
          path: |
            *.3dsx
            *.cia
            *.smdh
            *.elf
            *.exheader

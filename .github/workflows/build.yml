name: Build 3DSX + CIA - V4.5

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar arquivos sem apagar arte
        run: |
          export PATH="/opt/devkitpro/tools/bin:/opt/devkitpro/devkitARM/bin:$PATH"
          echo "=== NAO apaga icon.png banner.png umbreon_cry.wav ==="
          ls -lh icon.png banner.png umbreon_cry.wav source/main.c Makefile || exit 1
          echo "=== Tamanho PNG - tem que ser icon 48x48 banner 256x128 ==="
          python3 -c "from PIL import Image; print('icon:', Image.open('icon.png').size); print('banner:', Image.open('banner.png').size)" || file icon.png banner.png
          echo "=== Som original intacto - so leitura ==="
          ls -lh umbreon_cry.wav
          md5sum umbreon_cry.wav || sha256sum umbreon_cry.wav

      - name: Build 3DSX
        run: |
          export PATH="/opt/devkitpro/tools/bin:/opt/devkitpro/devkitARM/bin:$PATH"
          make clean || true
          make
          echo "=== Resultado 3DSX ==="
          ls -lh *.3dsx *.smdh *.elf build/*.elf 2>/dev/null || ls -lh *.3dsx *.elf
          test -f TomodachiLifeSaveEditor.3dsx || test -f build/TomodachiLifeSaveEditor.3dsx || (echo "ERRO: 3DSX nao gerado" && exit 1)

      - name: Make banner + icon + CIA - OBRIGATORIO
        run: |
          export PATH="/opt/devkitpro/tools/bin:/opt/devkitpro/devkitARM/bin:$PATH"
          mkdir -p build
          # Acha o ELF onde o Makefile oficial deixou ele
          ELF_FILE=$(find . -maxdepth 2 -name "TomodachiLifeSaveEditor.elf" | head -n1)
          echo "ELF encontrado: $ELF_FILE"
          cp -v "$ELF_FILE" build/strip-input.elf
          arm-none-eabi-strip -o build/TomodachiLifeSaveEditor-strip.elf build/strip-input.elf
          ls -lh build/TomodachiLifeSaveEditor-strip.elf

          # Icon - gera icon.icn novo, NAO apaga icon.png
          bannertool makesmdh -s "Tomodachi Life Save Editor" -l "Dinheiro Max no Tomodachi Life" -p "Darkness Metal" -i icon.png -o build/icon.icn
          ls -lh build/icon.icn

          # Banner - copia o som pra /tmp e converte SO a copia, original intacto
          cp -v umbreon_cry.wav /tmp/umbreon_for_banner.wav
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "Convertendo copia temporaria para 22050Hz mono..."
            ffmpeg -y -i /tmp/umbreon_for_banner.wav -ar 22050 -ac 1 -acodec pcm_s16le /tmp/umbreon_banner_final.wav || cp /tmp/umbreon_for_banner.wav /tmp/umbreon_banner_final.wav
          else
            echo "Sem ffmpeg, usa copia original"
            cp /tmp/umbreon_for_banner.wav /tmp/umbreon_banner_final.wav
          fi
          # Tenta 1: banner com som | Tenta 2: banner com som original | Tenta 3: banner sem som pra nao travar o CIA
          bannertool makebanner -i banner.png -a /tmp/umbreon_banner_final.wav -o build/banner.bnr || bannertool makebanner -i banner.png -a umbreon_cry.wav -o build/banner.bnr || bannertool makebanner -i banner.png -o build/banner.bnr
          ls -lh build/banner.bnr
          echo "=== Som original ainda intacto? ==="
          md5sum umbreon_cry.wav || sha256sum umbreon_cry.wav

          # RSF - UniqueId 0x0A5E1 diferente do jogo 0x008C3
          cat > build/app.rsf << 'RSFEOF'
          BasicInfo:
            Title                   : "Tomodachi Life Save Editor"
            ProductCode             : "CTR-P-TLSE"
            Logo                    : Nintendo
          TitleInfo:
            Category                : Application
            UniqueId                : 0x0A5E1
          Option:
            UseOnSD                 : true
            FreeProductCode         : true
            MediaFootPadding        : false
            EnableCrypt             : false
            EnableCompress          : true
          AccessControlInfo:
            CoreVersion                   : 2
            DescVersion                   : 2
            ReleaseKernelMajor            : "02"
            ReleaseKernelMinor            : "33"
            UseExtSaveData                : false
            FileSystemAccess:
              - CategoryFileSystemTool
              - DirectSdmc
            MemoryType                    : Application
            SystemMode                    : 64MB
            IdealProcessor                : 0
            AffinityMask                  : 1
            Priority                      : 16
            MaxCpu                        : 0x9E
            HandleTableSize               : 0x200
            DisableDebug                  : false
            EnableForceDebug              : false
            CanWriteSharedPage            : true
            CanUsePrivilegedPriority      : false
            CanUseNonAlphabetAndNumber    : true
            PermitMainFunctionArgument    : true
            CanShareDeviceMemory          : true
            RunnableOnSleep               : false
            SpecialMemoryArrange          : true
            SystemModeExt                 : Legacy
            CpuSpeed                      : 256MHz
            EnableL2Cache                 : true
            CanAccessCore2                : true
            IORegisterMapping:
              - 1ff00000-1ff7ffff
            MemoryMapping:
              - 1f000000-1f5fffff:r
            SystemCallAccess:
              ArbitrateAddress: 34
              Backdoor: 123
              Break: 60
              CancelTimer: 28
              ClearEvent: 25
              ClearTimer: 29
              CloseHandle: 35
              ConnectToPort: 45
              ControlMemory: 1
              ControlProcessMemory: 112
              CreateAddressArbiter: 33
              CreateEvent: 23
              CreateMemoryBlock: 30
              CreateMutex: 19
              CreateSemaphore: 21
              CreateThread: 8
              CreateTimer: 26
              DuplicateHandle: 39
              ExitProcess: 3
              ExitThread: 9
              GetCurrentProcessorNumber: 17
              GetHandleInfo: 41
              GetProcessId: 53
              GetProcessIdOfThread: 54
              GetProcessIdealProcessor: 6
              GetProcessInfo: 43
              GetResourceLimit: 56
              GetResourceLimitCurrentValues: 58
              GetResourceLimitLimitValues: 57
              GetSystemInfo: 42
              GetSystemTick: 40
              GetThreadContext: 59
              GetThreadId: 55
              GetThreadIdealProcessor: 15
              GetThreadInfo: 44
              GetThreadPriority: 11
              MapMemoryBlock: 31
              OutputDebugString: 61
              QueryMemory: 2
              ReleaseMutex: 20
              ReleaseSemaphore: 22
              SendSyncRequest1: 46
              SendSyncRequest2: 47
              SendSyncRequest3: 48
              SendSyncRequest4: 49
              SendSyncRequest: 50
              SetThreadPriority: 12
              SetTimer: 27
              SignalEvent: 24
              SleepThread: 10
              UnmapMemoryBlock: 32
              WaitSynchronization1: 36
              WaitSynchronizationN: 37
            ServiceAccessControl:
              - APT:U
              - ac:u
              - am:net
              - boss:U
              - cam:u
              - cecd:u
              - cfg:nor
              - cfg:u
              - csnd:SND
              - dsp::DSP
              - frd:u
              - fs:USER
              - gsp::Gpu
              - hid:USER
              - http:C
              - ir:rst
              - ir:u
              - ir:USER
              - mic:u
              - ndm:u
              - news:u
              - nwm::UDS
              - ptm:u
              - pxi:dev
              - soc:U
              - ssl:C
              - y2r:u
          SystemControlInfo:
            SaveDataSize: 0KB
            RemasterVersion: 2
            StackSize: 0x40000
          Dependency:
            ac: 0x0004013000002402
            am: 0x0004013000001502
            boss: 0x0004013000003402
            camera: 0x0004013000001602
            cecd: 0x0004013000002602
            cfg: 0x0004013000001702
            codec: 0x0004013000001802
            csnd: 0x0004013000002702
            dlp: 0x0004013000002802
            dsp: 0x0004013000001a02
            friends: 0x0004013000003202
            gpio: 0x0004013000001b02
            gsp: 0x0004013000001c02
            hid: 0x0004013000001d02
            http: 0x0004013000002902
            i2c: 0x0004013000001e02
            ir: 0x0004013000003302
            mcu: 0x0004013000001f02
            mic: 0x0004013000002002
            ndm: 0x0004013000002b02
            news: 0x0004013000003502
            nim: 0x0004013000002c02
            nwm: 0x0004013000002d02
            pdn: 0x0004013000002102
            ps: 0x0004013000003102
            ptm: 0x0004013000002202
            ro: 0x0004013000003702
            socket: 0x0004013000002e02
            spi: 0x0004013000002302
            ssl: 0x0004013000002f02
          RSFEOF
          cat build/app.rsf

          # CIA - makerom
          makerom -f cia -o build/TomodachiLifeSaveEditor.cia -DAPP_ENCRYPTED=false -rsf build/app.rsf -target t -exefslogo -elf build/TomodachiLifeSaveEditor-strip.elf -icon build/icon.icn -banner build/banner.bnr -major 1 -minor 0 -micro 0
          ls -lh build/TomodachiLifeSaveEditor.cia
          echo "=== CIA OK ==="

      - name: Upload tudo - CIA incluso
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TomodachiLifeSaveEditor-V4
          path: |
            TomodachiLifeSaveEditor.3dsx
            TomodachiLifeSaveEditor.smdh
            build/TomodachiLifeSaveEditor.cia
            build/TomodachiLifeSaveEditor.3dsx
            build/TomodachiLifeSaveEditor.smdh
          if-no-files-found: warn

      - name: Upload 3DSX mesmo se CIA falhar
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TomodachiLifeSaveEditor-3DSX-only
          path: |
            TomodachiLifeSaveEditor.3dsx
            TomodachiLifeSaveEditor.smdh
          if-no-files-found: warn

name: Build Tomodachi 3DS
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      - name: Build 3DSX
        run: |
          make
          smdhtool --create "Tomodachi Life Save Editor" "Dinheiro Max no Tomodachi Life" "Darkness Metal" icon.png TomodachiLifeSaveEditor.smdh
          ls -lh TomodachiLifeSaveEditor.elf TomodachiLifeSaveEditor.3dsx TomodachiLifeSaveEditor.smdh

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: TomodachiLifeSaveEditor-3DSX
          path: |
            TomodachiLifeSaveEditor.3dsx
            TomodachiLifeSaveEditor.smdh

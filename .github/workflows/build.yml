name: Build Tomodachi 3DS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Compilar
        run: make

      - name: Salvar .3dsx
        uses: actions/upload-artifact@v4
        with:
          name: TomodachiReal-3dsx
          path: |
            *.3dsx
            *.smdh
            *.elf

name: Build 3DS

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build V4
        run: make

      - name: Baixar ferramentas
        run: |
          mkdir -p tools
          wget -O tools/bannertool.tar.gz https://github.com/Steveice10/bannertool/releases/download/1.2.0/bannertool-1.2.0-linux.tar.gz || true
          tar -xzf tools/bannertool.tar.gz -C tools || true
          chmod +x tools/bannertool || true
          wget -O tools/makerom https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18.4/makerom-v0.18.4-ubuntu_x86_64 || true
          chmod +x tools/makerom || true

      - name: Fazer CIA
        run: |
          set -e
          ELF_FILE=$(ls *.elf | head -n 1)
          if [ ! -f sound.wav ]; then python3 -c "import wave; w=wave.open('sound.wav','wb'); w.setnchannels(1); w.setsampwidth(2); w.setframerate(22050); w.writeframes(b'\x00\x00'*22050); w.close()"; fi
          ./tools/bannertool makebanner -i banner.png -a sound.wav -o banner.bnr
          ./tools/bannertool makeicon -i icon.png -o icon.icn
          ./tools/makerom -f cia -o "Tomodachi Life Save Editor.cia" -elf "$ELF_FILE" -rsf TomodachiReal.rsf -icon icon.icn -banner banner.bnr -exefslogo -target t

      - name: Subir ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Tomodachi-V4-CIA
          path: |
            *.3dsx
            *.cia

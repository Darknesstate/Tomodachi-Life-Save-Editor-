name: Build 3DS

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      - name: Build 3DSX e SMDH
        run: make

      - name: Upload artefato
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TomodachiLifeSaveEditor
          path: |
            *.3dsx
            *.smdh

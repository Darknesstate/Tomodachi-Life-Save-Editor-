name: Build 3DS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Criar silencio.wav para banner sem som
        run: |
          mkdir -p assets
          python3 -c "import wave; w=wave.open('assets/silencio.wav','wb'); w.setnchannels(1); w.setsampwidth(2); w.setframerate(22050); w.writeframes(b'\x00\x00'*22050); w.close()"
          ls -lh assets/
      - name: Build 3dsx e CIA
        run: |
          make
          make cia
      - name: Ver o que foi gerado
        run: ls -lh
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: TomodachiLifeSaveEditor
          path: |
            *.3dsx
            *.smdh
            *.cia
            *.elf

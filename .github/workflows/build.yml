name: Build Tomodachi 3DS
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      - name: Check files
        run: |
          echo "=== Arquivos no repo ==="
          ls -lh || true
          echo "=== SUA IMAGEM + SOM ==="
          ls -lh icon.png banner.png umbreon_cry.wav || true
          file icon.png banner.png umbreon_cry.wav || true
          echo "Se icon.png e banner.png existem, sao os SEUS que vao pro CIA"

      - name: Build 3DSX + Shiny + Resize - NAO apaga sua arte
        run: |
          make || (echo "make falhou, tentando clean" && make clean || true && make) || (echo "tentando make -j1" && make -j1) || (echo "ERRO MAKE" && exit 1)
          ls -lh TomodachiLifeSaveEditor.elf || (echo "SEM ELF" && exit 1)
          python3 -m pip install -q pillow || true
          python3 <<'PYEOF'
          try:
              from PIL import Image, ImageDraw
              import os
              # SO cria placeholder se VOCE nao subiu a imagem. Se subiu, mantem a sua.
              if not os.path.exists("icon.png"):
                  print("sem icon.png, criando placeholder")
                  im = Image.new("RGBA", (48,48), (20,20,40,255))
                  d = ImageDraw.Draw(im)
                  d.ellipse([8,8,40,40], fill=(255,200,0,255))
                  d.ellipse([16,16,32,32], fill=(30,30,50,255))
                  im.save("icon.png")
              if not os.path.exists("banner.png"):
                  print("sem banner.png, criando placeholder")
                  im = Image.new("RGBA", (256,128), (20,20,40,255))
                  d = ImageDraw.Draw(im)
                  d.ellipse([90,20,166,108], fill=(255,200,0,255))
                  im.save("banner.png")
              # Resize sem apagar conteudo - sua arte Darkness Metal continua
              if os.path.exists("icon.png"):
                  im = Image.open("icon.png").convert("RGBA").resize((48,48), Image.LANCZOS)
                  im.save("icon.png")
                  print("icon 48x48 ok - sua arte mantida")
              if os.path.exists("banner.png"):
                  im = Image.open("banner.png").convert("RGBA").resize((256,128), Image.LANCZOS)
                  im.save("banner.png")
                  print("banner 256x128 ok - sua arte Darkness Metal mantida")
              # Brilho por cima, sem apagar o que ja tem
              for src, dst in [("icon.png", "icon_shiny.png"), ("banner.png", "banner_shiny.png")]:
                  if not os.path.exists(src):
                      continue
                  im = Image.open(src).convert("RGBA")
                  w, h = im.size
                  draw = ImageDraw.Draw(im)
                  for fx, fy, s in [(0.78, 0.18, 0.12), (0.88, 0.38, 0.08)]:
                      cx, cy = int(w*fx), int(h*fy)
                      r = int(min(w,h)*s)
                      draw.line([(cx-r, cy), (cx+r, cy)], fill=(255,255,255,230), width=max(1, r//3))
                      draw.line([(cx, cy-r), (cx, cy+r)], fill=(255,255,255,230), width=max(1, r//3))
                  im.save(dst)
                  print(f"brilho adicionado em {dst}, sua arte intacta")
          except Exception as e:
              print(f"sem PIL: {e}")
          PYEOF
          if [ ! -f icon_shiny.png ]; then cp icon.png icon_shiny.png || true; fi
          if [ ! -f banner_shiny.png ]; then cp banner.png banner_shiny.png || true; fi
          ICON_FILE="icon.png"
          if [ -f icon_shiny.png ]; then ICON_FILE="icon_shiny.png"; fi
          smdhtool --create "Tomodachi Life Save Editor" "Dinheiro Max no Tomodachi Life" "Darkness Metal" $ICON_FILE TomodachiLifeSaveEditor.smdh || smdhtool --create "Tomodachi Life Save Editor" "Dinheiro Max" "Darkness Metal" icon.png TomodachiLifeSaveEditor.smdh || echo "smdhtool falhou"
          ls -lh TomodachiLifeSaveEditor.elf TomodachiLifeSaveEditor.3dsx TomodachiLifeSaveEditor.smdh || true

      - name: Get tools
        run: |
          mkdir -p /tmp/tools /tmp/bt /tmp/mk || true
          echo "=== makerom ==="
          curl -L --fail -o /tmp/makerom.zip https://github.com/3DSGuy/Project_CTR/releases/latest/download/makerom-linux-x86_64.zip || echo "tentativa 1 falhou"
          if [ ! -s /tmp/makerom.zip ] || head -c 4 /tmp/makerom.zip | grep -q "<"; then echo "zip invalido, tentativa 2" && curl -L --fail -o /tmp/makerom.zip https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18/makerom-v0.18-ubuntu_x86_64.zip || echo "tentativa 2 falhou"; fi
          if [ ! -s /tmp/makerom.zip ] || head -c 4 /tmp/makerom.zip | grep -q "<"; then echo "tentativa 3 BootNTR" && curl -L --fail -o /tmp/tools/makerom https://raw.githubusercontent.com/44670/BootNTR/master/lib/ctrcommon/tools/makerom-linux || echo "tentativa 3 falhou"; fi
          if [ -f /tmp/makerom.zip ]; then unzip -o /tmp/makerom.zip -d /tmp/mk || true; find /tmp/mk -type f -iname "*makerom*" -exec cp {} /tmp/tools/makerom \; || true; fi
          chmod +x /tmp/tools/makerom || true
          file /tmp/tools/makerom || true
          if [ ! -x /tmp/tools/makerom ] || ! file /tmp/tools/makerom | grep -qi "ELF"; then
            echo "makerom ainda nao e ELF, compilando do source"
            git clone --depth 1 https://github.com/3DSGuy/Project_CTR.git /tmp/Project_CTR || true
            cd /tmp/Project_CTR/makerom || cd /tmp/Project_CTR || true
            make || true
            find /tmp/Project_CTR -type f -name "makerom" -exec cp {} /tmp/tools/makerom \; || true
            chmod +x /tmp/tools/makerom || true
            cd $GITHUB_WORKSPACE || cd /github/workspace || true
          fi
          file /tmp/tools/makerom || true
          ls -lh /tmp/tools/makerom || echo "SEM MAKEROM"
          echo "=== bannertool ==="
          curl -L --fail -o /tmp/bannertool.zip https://github.com/Epicpkmn11/bannertool/releases/download/v1.2.0/bannertool.zip || curl -L --fail -o /tmp/bannertool.zip https://github.com/Steveice10/bannertool/releases/download/v1.2.0/bannertool.zip || echo "bannertool zip falhou"
          unzip -o /tmp/bannertool.zip -d /tmp/bt || true
          find /tmp/bt -type f | head -n 30 || true
          find /tmp/bt -type f -path "*linux*" -iname "*bannertool*" -exec cp {} /tmp/tools/bannertool \; || true
          if [ ! -f /tmp/tools/bannertool ]; then find /tmp/bt -type f -iname "*bannertool*" -exec cp {} /tmp/tools/bannertool \; || true; fi
          if [ ! -f /tmp/tools/bannertool ]; then curl -L --fail -o /tmp/tools/bannertool https://raw.githubusercontent.com/44670/BootNTR/master/lib/ctrcommon/tools/bannertool-linux || echo "bannertool fallback falhou"; fi
          chmod +x /tmp/tools/bannertool || true
          file /tmp/tools/bannertool || true
          ls -lh /tmp/tools/ || true

      - name: Som Umbreon - copiar sem alterar
        run: |
          if [ -f umbreon_cry.wav ]; then
            echo "Achou seu umbreon_cry.wav, copiando SEM alterar"
            cp umbreon_cry.wav banner_sound.wav
            ls -lh banner_sound.wav
            file banner_sound.wav || true
          else
            echo "Sem umbreon_cry.wav, banner vai sem som"
            rm -f banner_sound.wav || true
          fi
          ls -lh banner_sound.wav || echo "banner sem som"

      - name: Make banner + icon
        run: |
          export PATH="/tmp/tools:$PATH"
          BANNER_IMG="banner.png"
          if [ -f banner_shiny.png ]; then BANNER_IMG="banner_shiny.png"; fi
          ICON_IMG="icon.png"
          if [ -f icon_shiny.png ]; then ICON_IMG="icon_shiny.png"; fi
          ls -lh $BANNER_IMG $ICON_IMG banner_sound.wav || true
          if [ -x /tmp/tools/bannertool ]; then
            if [ -f banner_sound.wav ]; then
              echo "Banner COM seu som original"
              bannertool makebanner -i $BANNER_IMG -a banner_sound.wav -o banner.bnr || (echo "com som falhou, tentando sem som" && bannertool makebanner -i $BANNER_IMG -o banner.bnr) || echo "bannertool falhou"
            else
              echo "Banner SEM som"
              bannertool makebanner -i $BANNER_IMG -o banner.bnr || echo "bannertool falhou"
            fi
            bannertool makesmdh -s "Tomodachi Life Save Editor" -l "Dinheiro Max no Tomodachi Life" -p "Darkness Metal" -i $ICON_IMG -o TomodachiLifeSaveEditor.icn || echo "makesmdh falhou, usando smdh"
            ls -lh banner.bnr TomodachiLifeSaveEditor.icn || true
          else
            echo "SEM bannertool, pulando banner"
          fi
          if [ ! -f TomodachiLifeSaveEditor.icn ]; then cp TomodachiLifeSaveEditor.smdh TomodachiLifeSaveEditor.icn || true; fi
          ls -lh banner.bnr TomodachiLifeSaveEditor.icn || true

      - name: Make CIA com varias tentativas - OBRIGATORIO
        run: |
          export PATH="/tmp/tools:$PATH"
          if [ ! -x /tmp/tools/makerom ]; then echo "ERRO: sem makerom"; exit 1; fi
          python3 <<'PYEOF'
          full = """BasicInfo:
            Title                   : "Tomodachi Life Save Editor"
            ProductCode             : "CTR-P-TLSE"
            Logo                    : Nintendo
          TitleInfo:
            Category                : Application
            UniqueId                : 0x01F001
          Option:
            UseOnSD                 : true
            FreeProductCode         : true
            MediaFootPadding        : false
            EnableCrypt             : false
            EnableCompress          : true
          AccessControlInfo:
            CoreVersion                   : 2
            DescVersion                   : 2
            ReleaseKernelMajor            : "02"
            ReleaseKernelMinor            : "33"
            UseExtSaveData                : false
            FileSystemAccess:
              - CategoryFileSystemTool
              - DirectSdmc
              - DirectSdmcWrite
              - Debug
            MemoryType                    : Application
            SystemMode                    : 64MB
            IdealProcessor                : 0
            AffinityMask                  : 1
            Priority                      : 16
            MaxCpu                        : 0x9E
            HandleTableSize               : 0x200
            DisableDebug                  : false
            EnableForceDebug              : false
            CanWriteSharedPage            : true
            CanUsePrivilegedPriority      : false
            CanUseNonAlphabetAndNumber    : true
            PermitMainFunctionArgument    : true
            CanShareDeviceMemory          : true
            RunnableOnSleep               : false
            SpecialMemoryArrange          : true
            SystemModeExt                 : Legacy
            CpuSpeed                      : 256MHz
            EnableL2Cache                 : true
            CanAccessCore2                : true
            IORegisterMapping:
              - 1ff00000-1ff7ffff
            MemoryMapping:
              - 1f000000-1f5fffff:r
            SystemCallAccess:
              ArbitrateAddress: 34
              Backdoor: 123
              Break: 60
              CancelTimer: 28
              ClearEvent: 25
              ClearTimer: 29
              CloseHandle: 35
              ConnectToPort: 45
              ControlMemory: 1
              ControlProcessMemory: 112
              CreateAddressArbiter: 33
              CreateEvent: 23
              CreateMemoryBlock: 30
              CreateMutex: 19
              CreateSemaphore: 21
              CreateThread: 8
              CreateTimer: 26
              DuplicateHandle: 39
              ExitProcess: 3
              ExitThread: 9
              GetCurrentProcessorNumber: 17
              GetHandleInfo: 41
              GetProcessId: 53
              GetProcessIdOfThread: 54
              GetProcessIdealProcessor: 6
              GetProcessInfo: 43
              GetResourceLimit: 56
              GetResourceLimitCurrentValues: 58
              GetResourceLimitLimitValues: 57
              GetSystemInfo: 42
              GetSystemTick: 40
              GetThreadContext: 59
              GetThreadId: 55
              GetThreadIdealProcessor: 15
              GetThreadInfo: 44
              GetThreadPriority: 11
              MapMemoryBlock: 31
              OutputDebugString: 61
              QueryMemory: 2
              ReleaseMutex: 20
              ReleaseSemaphore: 22
              SendSyncRequest1: 46
              SendSyncRequest2: 47
              SendSyncRequest3: 48
              SendSyncRequest4: 49
              SendSyncRequest: 50
              SetThreadPriority: 12
              SetTimer: 27
              SignalEvent: 24
              SleepThread: 10
              UnmapMemoryBlock: 32
              WaitSynchronization1: 36
              WaitSynchronizationN: 37
            ServiceAccessControl:
              - APT:U
              - ac:u
              - am:net
              - boss:U
              - cam:u
              - cecd:u
              - cfg:nor
              - cfg:u
              - csnd:SND
              - dsp::DSP
              - frd:u
              - fs:USER
              - gsp::Gpu
              - hid:USER
              - http:C
              - ir:rst
              - ir:u
              - ir:USER
              - mic:u
              - ndm:u
              - news:u
              - nwm::UDS
              - ptm:u
              - pxi:dev
              - soc:U
              - ssl:C
              - y2r:u
          SystemControlInfo:
            SaveDataSize: 0KB
            RemasterVersion: 2
            StackSize: 0x40000
            Dependency:
              ac: 0x0004013000002402
              am: 0x0004013000001502
              boss: 0x0004013000003402
              camera: 0x0004013000001602
              cecd: 0x0004013000002602
              cfg: 0x0004013000001702
              codec: 0x0004013000001802
              csnd: 0x0004013000002702
              dlp: 0x0004013000002802
              dsp: 0x0004013000001a02
              friends: 0x0004013000003202
              gpio: 0x0004013000001b02
              gsp: 0x0004013000001c02
              hid: 0x0004013000001d02
              http: 0x0004013000002902
              i2c: 0x0004013000001e02
              ir: 0x0004013000003302
              mcu: 0x0004013000001f02
              mic: 0x0004013000002002
              ndm: 0x0004013000002b02
              news: 0x0004013000003502
              nim: 0x0004013000002c02
              nwm: 0x0004013000002d02
              pdn: 0x0004013000002102
              ps: 0x0004013000003102
              ptm: 0x0004013000002202
              ro: 0x0004013000003702
              socket: 0x0004013000002e02
              spi: 0x0004013000002302
              ssl: 0x0004013000002f02
          """
          mini = """BasicInfo:
            Title                   : "Tomodachi Life Save Editor"
            ProductCode             : "CTR-P-TLSE"
            Logo                    : Nintendo
          TitleInfo:
            Category                : Application
            UniqueId                : 0x01F001
          Option:
            UseOnSD                 : true
            FreeProductCode         : true
            MediaFootPadding        : false
            EnableCrypt             : false
            EnableCompress          : true
          AccessControlInfo:
            CoreVersion                   : 2
            DescVersion                   : 2
            ReleaseKernelMajor            : "02"
            ReleaseKernelMinor            : "33"
            UseExtSaveData                : false
            FileSystemAccess:
              - CategoryFileSystemTool
              - DirectSdmc
              - DirectSdmcWrite
            MemoryType                    : Application
            SystemMode                    : 64MB
            IdealProcessor                : 0
            AffinityMask                  : 1
            Priority                      : 16
            MaxCpu                        : 0x9E
            HandleTableSize               : 0x200
          SystemControlInfo:
            SaveDataSize: 0KB
            RemasterVersion: 2
            StackSize: 0x40000
          """
          open("game.rsf","w").write(full)
          open("game_min.rsf","w").write(mini)
          print("RSF full e mini escritos")
          PYEOF
          cat game.rsf
          echo "=== Tentativa 1: RSF full + desc app:4 + banner ==="
          if [ -f banner.bnr ]; then makerom -f cia -o TomodachiLifeSaveEditor.cia -rsf game.rsf -target t -desc app:4 -exefslogo -elf TomodachiLifeSaveEditor.elf -icon TomodachiLifeSaveEditor.icn -banner banner.bnr && echo "T1 OK" || echo "T1 falhou"; else echo "sem banner, pulando T1"; fi
          if [ ! -f TomodachiLifeSaveEditor.cia ]; then echo "=== Tentativa 2: RSF mini + desc app:4 ==="; if [ -f banner.bnr ]; then makerom -f cia -o TomodachiLifeSaveEditor.cia -rsf game_min.rsf -target t -desc app:4 -exefslogo -elf TomodachiLifeSaveEditor.elf -icon TomodachiLifeSaveEditor.icn -banner banner.bnr && echo "T2 OK" || echo "T2 falhou"; else makerom -f cia -o TomodachiLifeSaveEditor.cia -rsf game_min.rsf -target t -desc app:4 -exefslogo -elf TomodachiLifeSaveEditor.elf -icon TomodachiLifeSaveEditor.icn && echo "T2 OK sem banner" || echo "T2 falhou"; fi; fi
          if [ ! -f TomodachiLifeSaveEditor.cia ]; then echo "=== Tentativa 3: RSF full sem desc ==="; makerom -f cia -o TomodachiLifeSaveEditor.cia -rsf game.rsf -target t -exefslogo -elf TomodachiLifeSaveEditor.elf -icon TomodachiLifeSaveEditor.icn -banner banner.bnr && echo "T3 OK" || echo "T3 falhou"; fi
          if [ ! -f TomodachiLifeSaveEditor.cia ]; then echo "=== Tentativa 4: RSF full + desc app:2 sem exefslogo ==="; makerom -f cia -o TomodachiLifeSaveEditor.cia -rsf game.rsf -target t -desc app:2 -elf TomodachiLifeSaveEditor.elf -icon TomodachiLifeSaveEditor.icn -banner banner.bnr && echo "T4 OK" || echo "T4 falhou"; fi
          if [ ! -f TomodachiLifeSaveEditor.cia ]; then echo "=== Tentativa 5: CXI depois CIA ==="; makerom -f cxi -o TomodachiLifeSaveEditor.cxi -rsf game.rsf -target t -desc app:4 -exefslogo -elf TomodachiLifeSaveEditor.elf -icon TomodachiLifeSaveEditor.icn -banner banner.bnr && makerom -f cia -o TomodachiLifeSaveEditor.cia -content TomodachiLifeSaveEditor.cxi:0:0 && echo "T5 OK" || echo "T5 falhou"; fi
          if [ ! -f TomodachiLifeSaveEditor.cia ]; then echo "=== Tentativa 6: Sem banner ==="; makerom -f cia -o TomodachiLifeSaveEditor.cia -rsf game_min.rsf -target t -desc app:4 -elf TomodachiLifeSaveEditor.elf -icon TomodachiLifeSaveEditor.icn && echo "T6 OK" || echo "T6 falhou"; fi
          echo "=== VERIFICACAO FINAL CIA ==="
          ls -lh TomodachiLifeSaveEditor.3dsx TomodachiLifeSaveEditor.smdh TomodachiLifeSaveEditor.cia || true
          if [ -f TomodachiLifeSaveEditor.cia ]; then echo "CIA OK - pode instalar pelo FBI"; else echo "CIA FALHOU - me manda o log"; fi

      - name: Upload tudo - CIA incluso
        uses: actions/upload-artifact@v4
        with:
          name: TomodachiLifeSaveEditor
          path: |
            TomodachiLifeSaveEditor.3dsx
            TomodachiLifeSaveEditor.smdh
            TomodachiLifeSaveEditor.cia
          if-no-files-found: error

      - name: Upload 3DSX mesmo se CIA falhar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TomodachiLifeSaveEditor-3DSX-fallback
          path: |
            TomodachiLifeSaveEditor.3dsx
            TomodachiLifeSaveEditor.smdh
          if-no-files-found: warn

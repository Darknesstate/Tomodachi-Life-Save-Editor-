name: Build Tomodachi 3DS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Compilar .3dsx e .cia
        shell: bash
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM
          export PATH=$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH
          echo "=== FASE 1: ELF e 3DSX ==="
          arm-none-eabi-gcc -g -Wall -O2 -march=armv6k -mtune=mpcore -mfloat-abi=hard -mtp=soft -DARM11 -D_3DS -I$DEVKITPRO/libctru/include source/main.c -o TomodachiReal.elf -specs=3dsx.specs -L$DEVKITPRO/libctru/lib -lctru -lm
          ls -lh TomodachiReal.elf || true
          test -s TomodachiReal.elf
          3dsxtool TomodachiReal.elf TomodachiReal.3dsx
          ls -lh TomodachiReal.3dsx || true
          test -s TomodachiReal.3dsx
          echo "=== FASE 1b: strip para makerom ==="
          cp TomodachiReal.elf TomodachiReal.elf.orig
          arm-none-eabi-strip TomodachiReal.elf
          ls -lh TomodachiReal.elf TomodachiReal.elf.orig || true
          echo "=== FASE 2: icone SMDH + banner + audio silencioso ==="
          python3 << 'PYEOF'
          import zlib, struct, wave, io
          # Icone 48x48
          w = h = 48
          raw = b''.join([b'\x00' + b'\xff\x33\x33\xff' * w for _ in range(h)])
          def chunk(t, d):
              c = t + d
              return struct.pack('>I', len(d)) + c + struct.pack('>I', zlib.crc32(c) & 0xffffffff)
          open('icon48.png', 'wb').write(b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 6, 0, 0, 0)) + chunk(b'IDAT', zlib.compress(raw)) + chunk(b'IEND', b''))
          # Banner 256x128
          w2 = 256
          h2 = 128
          raw2 = b''.join([b'\x00' + b'\x33\x33\xff\xff' * w2 for _ in range(h2)])
          open('banner.png', 'wb').write(b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('>IIBBBBB', w2, h2, 8, 6, 0, 0, 0)) + chunk(b'IDAT', zlib.compress(raw2)) + chunk(b'IEND', b''))
          # WAV silencioso 1s, 22050Hz, mono, 16-bit - bannertool exige -a
          with wave.open('silence.wav', 'wb') as wf:
              wf.setnchannels(1)
              wf.setsampwidth(2)
              wf.setframerate(22050)
              wf.writeframes(b'\x00\x00' * 22050)
          print('icon48.png, banner.png, silence.wav criados')
          PYEOF
          ls -lh icon48.png banner.png silence.wav || true
          smdhtool --create "TomodachiReal" "Editor de Save Tomodachi" "Darknesstate" icon48.png TomodachiReal.smdh
          ls -lh TomodachiReal.smdh || true
          echo "=== FASE 2b: baixar bannertool (nao vem no container) ==="
          if which bannertool; then
            echo "bannertool ja existe"
            BANNERTOOL_BIN=$(which bannertool)
          else
            echo "baixando bannertool..."
            rm -f bannertool.zip
            curl -L --retry 3 -f -o bannertool.zip https://github.com/Epicpkmn11/bannertool/releases/download/1.2.2/bannertool.zip || curl -L --retry 3 -f -o bannertool.zip https://github.com/Epicpkmn11/bannertool/releases/download/1.2.1/bannertool.zip || curl -L --retry 3 -f -o bannertool.zip https://github.com/Steveice10/bannertool/releases/download/1.2.0/bannertool.zip || true
            ls -lh bannertool.zip || true
            unzip -o bannertool.zip || true
            find . -name "bannertool*" -type f | head -20
            BANNERTOOL_BIN=$(find . -name "bannertool" -type f | head -1)
            echo "BANNERTOOL_BIN=$BANNERTOOL_BIN"
            test -n "$BANNERTOOL_BIN"
            chmod +x "$BANNERTOOL_BIN" || true
            ls -lh "$BANNERTOOL_BIN" || true
          fi
          echo "criando banner.bnr com audio..."
          "$BANNERTOOL_BIN" makebanner -i banner.png -a silence.wav -o TomodachiReal.bnr
          ls -lh TomodachiReal.bnr || true
          test -s TomodachiReal.bnr
          echo "=== FASE 3: RSF ==="
          cat > TomodachiReal.rsf << 'RSFEOF'
          BasicInfo:
            Title                   : "TomodachiReal"
            CompanyCode             : "00"
            ProductCode             : "CTR-P-TMDR"
            ContentType             : Application
            Logo                    : Nintendo
          TitleInfo:
            UniqueId                : 0x00D1D0
            Category                : Application
          Option:
            UseOnSD                 : true
            EnableCompress          : true
            FreeProductCode         : true
            EnableCrypt             : false
            MediaFootPadding        : false
          AccessControlInfo:
            CoreVersion             : 2
            DescVersion             : 2
            ReleaseKernelMajor      : "02"
            ReleaseKernelMinor      : "33"
            UseExtSaveData          : false
            FileSystemAccess:
              - DirectSdmc
            MemoryType              : Application
            SystemMode              : 64MB
            IdealProcessor          : 0
            AffinityMask            : 1
            Priority                : 16
            MaxCpu                  : 0
            HandleTableSize         : 0x200
            DisableDebug            : false
            EnableForceDebug        : false
            CanWriteSharedPage      : true
            CanUsePrivilegedPriority : false
            CanUseNonAlphabetAndNumber : true
            PermitMainFunctionArgument : true
            CanShareDeviceMemory    : true
            RunnableOnSleep         : false
            SpecialMemoryArrange    : true
            SystemModeExt           : 124MB
            CpuSpeed                : 804MHz
            EnableL2Cache           : true
            CanAccessCore2          : true
            IORegisterMapping:
              - 1ff00000-1ff7ffff
            MemoryMapping:
              - 1f000000-1f5fffff:r
            SystemCallAccess:
              ArbitrateAddress: 34
              Break: 60
              CancelTimer: 28
              ClearEvent: 25
              ClearTimer: 29
              CloseHandle: 35
              ConnectToPort: 45
              ControlMemory: 1
              CreateAddressArbiter: 33
              CreateEvent: 23
              CreateMemoryBlock: 30
              CreateMutex: 19
              CreateSemaphore: 21
              CreateThread: 8
              CreateTimer: 26
              DuplicateHandle: 39
              ExitProcess: 3
              ExitThread: 9
              GetCurrentProcessorNumber: 17
              GetHandleInfo: 41
              GetProcessId: 53
              GetProcessIdOfThread: 54
              GetProcessIdealProcessor: 6
              GetProcessInfo: 43
              GetResourceLimit: 56
              GetResourceLimitCurrentValues: 58
              GetResourceLimitLimitValues: 57
              GetSystemInfo: 42
              GetSystemTick: 40
              GetThreadContext: 59
              GetThreadId: 55
              GetThreadIdealProcessor: 15
              GetThreadInfo: 44
              GetThreadPriority: 11
              MapMemoryBlock: 31
              OutputDebugString: 61
              QueryMemory: 2
              ReleaseMutex: 20
              ReleaseSemaphore: 22
              SendSyncRequest1: 46
              SendSyncRequest2: 47
              SendSyncRequest3: 48
              SendSyncRequest4: 49
              SendSyncRequest: 50
              SetThreadPriority: 12
              SetTimer: 27
              SignalEvent: 24
              SleepThread: 10
              UnmapMemoryBlock: 32
              WaitSynchronization1: 36
              WaitSynchronizationN: 37
            ServiceAccessControl:
              - cfg:u
              - fs:USER
              - gsp::Gpu
              - hid:USER
              - ndm:u
              - APT:U
              - ac:u
              - am:net
              - boss:U
              - cam:u
              - cecd:u
              - csnd:SND
              - frd:u
              - http:C
              - ir:USER
              - ldr:ro
              - mic:u
              - ptm:u
              - soc:U
              - ssl:C
              - y2r:u
          SystemControlInfo:
            SaveDataSize            : 0KB
            RemasterVersion         : 0
            StackSize               : 0x40000
          RSFEOF
          echo "=== FASE 4: makerom - sem comando file ==="
          rm -f makerom.zip makerom
          if ! curl -L --retry 3 -f -o makerom.zip https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18.4/makerom-v0.18.4-ubuntu_x86_64.zip; then
            echo "primeiro link do makerom falhou, tentando segundo nome..."
            curl -L --retry 3 -f -o makerom.zip https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18.4/makerom-ubuntu_x86_64
          fi
          ls -lh makerom.zip || true
          echo "tentando descompactar makerom.zip..."
          if unzip -o makerom.zip; then
            echo "makerom descompactado de zip"
          else
            echo "makerom nao era zip, usando como binario direto"
            cp makerom.zip makerom
          fi
          MAKEROM_BIN=$(find . -name "makerom" -type f | head -1)
          echo "MAKEROM_BIN=$MAKEROM_BIN"
          test -n "$MAKEROM_BIN"
          chmod +x "$MAKEROM_BIN" || true
          ls -lh "$MAKEROM_BIN" || true
          echo "=== FASE 5: CIA direto do ELF stripado, com banner, sem -desc ==="
          "$MAKEROM_BIN" -f cia -o TomodachiReal.cia -elf TomodachiReal.elf -rsf TomodachiReal.rsf -target t -exefslogo -icon TomodachiReal.smdh -banner TomodachiReal.bnr
          ls -lh *.3dsx *.cia *.smdh *.bnr || true
          test -s TomodachiReal.cia
          stat -c%s TomodachiReal.cia

      - name: Salvar arquivos
        uses: actions/upload-artifact@v4
        with:
          name: TomodachiReal-cia
          path: |
            *.3dsx
            *.cia
            *.smdh
            *.bnr
            *.elf

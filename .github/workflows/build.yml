name: Build 3DS

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      - name: Build 3DSX e SMDH
        run: make

      - name: Instalar bannertool e makerom
        run: |
          echo "=== bannertool ==="
          curl -fL https://github.com/Epicpkmn11/bannertool/releases/download/v1.2.2/bannertool.zip -o /tmp/bannertool.zip
          python3 -m zipfile -e /tmp/bannertool.zip /tmp/bannertool
          cp /tmp/bannertool/linux-x86_64/bannertool /usr/local/bin/bannertool
          chmod +x /usr/local/bin/bannertool
          ls -l /usr/local/bin/bannertool
          echo "=== makerom - clonar com submodulos ==="
          rm -rf /tmp/Project_CTR
          git clone --recursive https://github.com/3DSGuy/Project_CTR.git /tmp/Project_CTR
          echo "=== makerom - compilar ==="
          set +e
          make -C /tmp/Project_CTR/makerom deps -j2
          make -C /tmp/Project_CTR/makerom program -j2
          set -e
          if [ ! -f /tmp/Project_CTR/makerom/bin/makerom ]; then
            echo "Compilar falhou, baixando makerom pronto"
            curl -fL https://raw.githubusercontent.com/libretro/RetroArch/master/ctr/tools/makerom-linux -o /usr/local/bin/makerom
            chmod +x /usr/local/bin/makerom
          else
            cp /tmp/Project_CTR/makerom/bin/makerom /usr/local/bin/makerom
            chmod +x /usr/local/bin/makerom
          fi
          ls -l /usr/local/bin/makerom
          makerom --help || makerom -h || true

      - name: Build CIA
        run: |
          echo "=== Arquivos ==="
          ls -l
          ls -l assets/ || ls -l ./
          ls -l TomodachiReal.rsf
          if [ -f assets/banner.png ]; then BANNER=assets/banner.png; elif [ -f banner.png ]; then BANNER=banner.png; else echo "banner.png nao achado"; exit 1; fi
          if [ -f assets/icon.png ]; then ICON=assets/icon.png; elif [ -f icon.png ]; then ICON=icon.png; else echo "icon.png nao achado"; exit 1; fi
          echo "BANNER=$BANNER ICON=$ICON"
          mkdir -p build
          echo "=== WAV silencioso para banner ==="
          python3 -c "import wave,struct; w=wave.open('build/silent.wav','wb'); w.setnchannels(1); w.setsampwidth(2); w.setframerate(22050); w.writeframes(struct.pack('<h',0)*22050); w.close()"
          echo "=== Banner e icone ==="
          bannertool makebanner -i "$BANNER" -a build/silent.wav -o build/banner.bnr
          bannertool makesmdh -s "Tomodachi Life Save Editor" -l "Tomodachi Life Save Editor" -p "Darkness Metal" -i "$ICON" -o build/icon.icn
          ls -l build/banner.bnr build/icon.icn
          echo "=== Achar ELF ==="
          ELF=$(find . -maxdepth 3 -name "*.elf" | head -n 1)
          echo "ELF=$ELF"
          ls -l "$ELF"
          echo "=== Makerom CIA ==="
          makerom -f cia -o TomodachiLifeSaveEditor.cia -DAPP_ENCRYPTED=false -rsf TomodachiReal.rsf -target t -exefslogo -elf "$ELF" -icon build/icon.icn -banner build/banner.bnr -major 1 -minor 0 -micro 0
          ls -lh *.cia *.3dsx *.smdh

      - name: Upload artefato
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TomodachiLifeSaveEditor
          path: |
            *.3dsx
            *.smdh
            *.cia
